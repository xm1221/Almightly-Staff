plugins {
    id 'dev.architectury.loom' version '1.13-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
    id 'org.jetbrains.kotlin.jvm'
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    apply plugin: 'kotlin'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name-$minecraft_version"
    }

    repositories {
        // Vendored mod jars (Hex Casting 1.21.1 / HexParse 1.21.1 are not on any
        // public maven we can reach, so they are committed under local-maven/).
        maven { url = rootProject.file('local-maven').toURI() }

        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven{ url= 'https://mvnrepository.com/artifact/' }
        maven{ url ='https://mirrors.qlu.edu.cn/bmclapi' }
        maven{url= 'https://mirror.sjtu.edu.cn/'}
        maven{url='https://central.sonatype.com/artifact/'}
        maven{url='https://ci.blamejared.com/'}
        maven { url = "https://api.modrinth.com/maven" }
        maven { url = "https://maven.hexxy.media" }
        maven { url = "https://maven.blamejared.com/" }
        maven { url = "https://maven.jamieswhiteshirt.com/libs-release/" }
        maven { url = "https://maven.kosmx.dev/" }
        maven { url = "https://maven.shedaniel.me/" }
        maven { url = "https://maven.terraformersmc.com/releases" }
        maven { url = "https://maven.ladysnake.org/releases" }
        maven { url = "https://mvn.devos.one/snapshots/" }
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        flatDir { dir "libs/" }
        flatDir { dir "../libs/" }
    }

    loom {
        silentMojangMappingsLicense()
    }
    var nameForRef = project.name.equals("common") ? "fabric" : project.name
    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
        compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
        // implementation "io.github.llamalad7:mixinextras-forge:0.5.0"  // NeoForge includes this

        // Hex Casting / HexParse, vendored in local-maven/ (see the repositories block).
        // The *-common artifact is published in intermediary naming and is only usable by
        // the :common project, which Loom remaps intermediary -> named. The per-loader
        // artifacts are already in official naming and contain the whole mod, including
        // everything from common, so the platform projects depend on those alone;
        // feeding the intermediary common jar into the NeoForge srg -> official remap
        // fails with "Failed to remap N mods".
        if (project.name == 'common') {
            modImplementation("at.petra-k.hexcasting:hexcasting-common-${project.minecraft_version}:${rootProject.hexcastingVersion}") { transitive = false }
            // HexParse has no -common artifact; common code imports its API, so use the
            // fabric build here (intermediary naming, which Loom remaps for :common).
            modImplementation("io.yukkuric.hexparse:hexparse-fabric-${project.minecraft_version}:${rootProject.hexparseVersion}") { transitive = false }
        } else {
            modImplementation("at.petra-k.hexcasting:hexcasting-${nameForRef}-${project.minecraft_version}:${rootProject.hexcastingVersion}") { transitive = false }
            modImplementation("io.yukkuric.hexparse:hexparse-${nameForRef}-${project.minecraft_version}:${rootProject.hexparseVersion}") { transitive = false }
        }

    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }

    compileKotlin {
        kotlinOptions {
            jvmTarget = "21"
        }
    }
    compileTestKotlin {
        kotlinOptions {
            jvmTarget = "21"
        }
    }
}
