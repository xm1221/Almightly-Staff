name: Build and test

on:
  push:
    branches:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Architectury Loom 1.11 (unpick 3.0) requires a Java 21+ runtime for Gradle,
      # while Gradle 8.12.1 cannot instantiate Test tasks on Java 25. Mod bytecode
      # targets Java 17 via options.release=17 / jvmTarget=17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build mod
        run: ./gradlew :common:test :common:classes :fabric:classes :forge:classes build
