name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_github:
        description: Publish to GitHub
        type: boolean
        default: true
      publish_modrinth:
        description: Publish to Modrinth
        type: boolean
        default: true
      dry_run:
        description: Perform a dry run
        type: boolean
        default: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish-mod:
    needs: build
    if: github.event_name == 'push' || inputs.publish_modrinth || inputs.publish_github
    runs-on: ubuntu-latest
    environment:
      name: curseforge-modrinth
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew build

      - name: Publish to GitHub
        if: github.event_name == 'push' || inputs.publish_github
        env:
          DRY_RUN: ${{ github.event_name != 'push' && inputs.dry_run && 'true' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishGithub

      - name: Publish to Modrinth
        if: github.event_name == 'push' || inputs.publish_modrinth
        env:
          DRY_RUN: ${{ github.event_name != 'push' && inputs.dry_run && 'true' || '' }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew publishModrinth

      - name: Upload dry run artifact
        if: github.event_name != 'push' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: dry-run
          path: '*/build/publishMods'
          if-no-files-found: error
