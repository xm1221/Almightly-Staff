# 自动发布 hexdoc 包到 PyPI
# 触发：push main（版本与 PyPI 最新不同时自动发布，相同则跳过）+ 手动 workflow_dispatch
# 认证：PyPI Trusted Publishing（OIDC）——pypi.org 项目设置里添加 trusted publisher：
#   owner=xm1221, repository=<本仓库>, workflow=publish.yml
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # PyPI Trusted Publishing 需要

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hexdoc-almightly-staff
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel

      - name: Check if version already published on PyPI
        id: check
        run: |
          set -euo pipefail
          VER="$(basename "$(ls dist/*.whl)" | sed -E 's/^[^-]+-([^-]+)-py3.*/\1/')"
          LATEST="$(curl -s https://pypi.org/pypi/hexdoc-almightly-staff/json | python3 -c 'import sys,json;print(json.load(sys.stdin)["info"]["version"])' 2>/dev/null || true)"
          if [ "$VER" = "$LATEST" ]; then
            echo "Version $VER already published on PyPI - skipping upload"
            echo "publish_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VER not on PyPI (latest: ${LATEST:-none}) - will publish"
            echo "publish_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package to PyPI
        if: steps.check.outputs.publish_needed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: false
