plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    forge {
        mixinConfig"almightly_staff.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

repositories {
    mavenCentral()
    maven {
        name = "SpongePowered"
        url = "https://repo.spongepowered.org/repository/maven-public/"
    }
    // ... 可能还有其他仓库，比如 mavenLocal()
}
configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"
    implementation ("maven.modrinth:caelus:${caelus_version}")
    //implementation ("maven.modrinth:inline:${inline_version}-forge")
    implementation ("maven.modrinth:patchouli:${minecraft_version}-${patchouli_version}-forge")
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:0.2.0"))
    implementation(include("io.github.llamalad7:mixinextras-forge:0.2.0"))
    implementation ("at.petra-k.paucal:paucal-forge-${minecraft_version}:${paucal_version}")
    implementation ("at.petra-k.hexcasting:hexcasting-forge-${minecraft_version}:${hexcasting_version}")

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

