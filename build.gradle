plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'org.jetbrains.kotlin.jvm' version '2.2.20'
    id 'me.modmuss50.mod-publish-plugin' version '1.0.0'
}

apply plugin: "org.jetbrains.kotlin.jvm"

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

publishMods {
    def isCI = (System.getenv("CI") ?: "").trim().length() > 0
    def isDryRun = (System.getenv("DRY_RUN") ?: "").trim().length() > 0
    dryRun = !isCI || isDryRun

    type = STABLE
    displayName = "v${project.version}"
    changelog = provider {
        def lines = rootProject.file("CHANGELOG.md").readLines("UTF-8")
        def afterHeader = lines.dropWhile { !it.startsWith("## ") }.drop(1)
        afterHeader.takeWhile { !it.startsWith("## ") }
            .collect { it.replaceFirst(/^### /, "## ") }
            .join("\n")
            .trim()
    }

    github {
        accessToken = System.getenv("GITHUB_TOKEN") ?: ""
        repository = System.getenv("GITHUB_REPOSITORY") ?: ""
        commitish = System.getenv("GITHUB_SHA") ?: ""
        allowEmptyFiles = true
    }
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        mavenCentral()
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
        }
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.hexxy.media" }
        maven { url = "https://maven.blamejared.com/" }
        maven { url = "https://maven.jamieswhiteshirt.com/libs-release/" }
        maven { url = "https://maven.kosmx.dev/" }
        maven { url = "https://maven.shedaniel.me/" }
        maven { url = "https://maven.terraformersmc.com/releases" }
        maven { url = "https://maven.ladysnake.org/releases" }
        maven { url = "https://maven.theillusivec4.top" }
        maven { url = "https://mvn.devos.one/snapshots/" }
        maven {
            url = "https://cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
        exclusiveContent {
            filter {
                includeGroup "cn.xm1221.MieLib"
            }
            forRepository {
                mavenLocal()
            }
            forRepository {
                maven {
                    name = "xm1221Maven"
                    url = "https://xm1221.github.io/maven"
                }
            }
        }
        flatDir { dir "libs/" }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
        implementation "io.github.llamalad7:mixinextras-forge:0.5.0"

        modImplementation("at.petra-k.hexcasting:hexcasting-common-${project.minecraft_version}:${project.hexcasting_version}") { transitive = false }
        modImplementation "curse.maven:hexparse-1148731:7676910"
    }

    java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release = 17
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = "UTF-8"
        options.charSet = "UTF-8"
        options.docEncoding = "UTF-8"
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        repositories {
        }
    }
}
