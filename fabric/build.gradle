plugins {
    id 'com.github.johnrengelman.shadow'
    id 'me.modmuss50.mod-publish-plugin'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url "https://maven.terraformersmc.com/" }
}

dependencies {
    minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    mappings loom.officialMojangMappings()

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    modApi "com.terraformersmc:modmenu:$rootProject.mod_menu_version"
    modImplementation "at.petra-k.hexcasting:hexcasting-fabric-1.20.1:$rootProject.hexcasting_version"
    modApi("cn.xm1221.MieLib:mielib-fabric:${rootProject.mielib_version}") { transitive = false }
    include("cn.xm1221.MieLib:mielib-fabric:${rootProject.mielib_version}")
    modImplementation("net.fabricmc:fabric-language-kotlin:1.13.9+kotlin.2.3.10")
    modApi "me.shedaniel.cloth:cloth-config:${rootProject.cloth_config_version}"

    common(project(path: ':common', configuration: 'namedElements')) {transitive = false}
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

publishMods {
    def isCI = (System.getenv("CI") ?: "").trim().length() > 0
    def isDryRun = (System.getenv("DRY_RUN") ?: "").trim().length() > 0
    dryRun = !isCI || isDryRun

    file = remapJar.archiveFile
    modLoaders.add("fabric")
    type = STABLE
    displayName = "Almightly Staff ${project.version} [Fabric]"
    changelog = rootProject.publishMods.changelog

    modrinth {
        accessToken = System.getenv("MODRINTH_TOKEN") ?: ""
        projectId = rootProject.modrinth_id
        minecraftVersions.add(rootProject.minecraft_version)
        requires("architectury-api")
        requires("fabric-api")
        requires("fabric-language-kotlin")
        requires("hex-casting")
        requires("cloth-config")
        optional("modmenu")
    }

    github {
        parent(rootProject.tasks.named("publishGithub"))
    }
}
